server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Mirrors vite.config.ts's dev-server proxy — same two paths forwarded to the Api container.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_set_header Host $host;
    }
}
